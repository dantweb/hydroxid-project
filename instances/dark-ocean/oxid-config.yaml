# HydroXid instance "dark-ocean" — theme hydroxid-dark-ocean.
# !! This file is NEVER served. The browser gets /oxid-config.json, rendered from it (allow-list;
# !! secrets refused). Everything under plugins.*.config is PUBLIC. !!
instance:
  id: hydroxid-dark-ocean
  name: HydroXid

shop:
  graphql_url: /graphql/

i18n:
  # one language per instance: the browser's language does not override it
  default_locale: de
  fallback_locale: de
  locales: [de]

theme:
  default: default
  active: hydroxid-dark-ocean

# order matters: a layout plugin is listed after the plugins whose slots it overrides
plugins:
  shop:
    config:
      products_per_page: 8
  checkout: {}
  # pay1 offers Stripe and Mollie (PayPal's module is not installed there). Inline (iframe) mode;
  # the values are PUBLIC by design (publishable key, profile id) — never a secret key.
  payment-stripe:
    config:
      mode: iframe
      publishable_key: pk_test_51U2oboD514s7wzZp9C41voTZpZ0aK1TSv6JaAWPlszRaegsUdnILV2JHuxF0GjpqywBs3Afzrg0qrVq81vMmSX2w00W7Fl9qDT
  payment-mollie:
    config:
      mode: iframe
      profile_id: pfl_cVf8bSWdQV
      test_mode: true
      methods: [creditcard, ideal, bancontact]
  dashboard: {} # replaced by plugins/dashboard-override (same name)
  hydroxid: {} # extends the peroxid layout plugin (header, front page, search) — needs `shop`
  gdpr-cookie-consent:
    config:
      version: 1
      privacy_policy_url: /privacy
      position: center
  # keeps devices on the latest release: an open page notices a new deploy and reloads (not in the checkout)
  release-watcher:
    config:
      interval_seconds: 30
      auto_reload: true
