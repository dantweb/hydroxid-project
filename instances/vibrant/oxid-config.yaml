# HydroXid instance "vibrant" — theme hydroxid-vibrant.
# !! This file is NEVER served. The browser gets /oxid-config.json, rendered from it (allow-list;
# !! secrets refused). Everything under plugins.*.config is PUBLIC. !!
instance:
  id: hydroxid-vibrant
  name: PEROXID

shop:
  graphql_url: /graphql/

i18n:
  # the instance's default language opens first; the browser's language never overrides it,
  # the shopper switches with the header dropdown (oxid-fe-user i18n.browser_language)
  default_locale: en
  fallback_locale: en
  locales: [en, de]
  browser_language: false

theme:
  default: default
  active: hydroxid-vibrant

# order matters: a layout plugin is listed after the plugins whose slots it overrides
plugins:
  shop:
    config:
      products_per_page: 8
  checkout: {}
  # pay1 offers Stripe and Mollie (PayPal's module is not installed there). Inline (iframe) mode;
  # the values are PUBLIC by design (publishable key, profile id) — never a secret key.
  payment-stripe:
    config:
      mode: iframe
  payment-mollie:
    config:
      mode: iframe
      methods: [creditcard, ideal, bancontact]
  dashboard: {} # replaced by plugins/dashboard-override (same name)
  hydroxid: {} # extends the peroxid layout plugin (header, front page; the search comes from `shop`) — needs `shop`
  gdpr-cookie-consent:
    config:
      version: 1
      privacy_policy_url: /privacy
      position: center
  # keeps devices on the latest release: an open page notices a new deploy and reloads (not in the checkout)
  release-watcher:
    config:
      interval_seconds: 30
      auto_reload: true
